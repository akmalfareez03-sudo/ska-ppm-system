<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk — SKA PPM Portal</title>

  <style>
    [x-cloak] { display: none !important; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase App, Auth & Firestore Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4" x-data="ppmApp">

  <!-- Skrin Pemuatan Semasa Semak Sesi -->
  <div x-show="authChecking" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center text-white">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3"></div>
    <p class="text-xs font-mono tracking-wider text-slate-300">Menyemak sesi pengguna...</p>
  </div>

  <!-- Kotak Log Masuk -->
  <div x-cloak x-show="!authChecking" class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-200 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="flex justify-center items-center gap-3 mb-2">
        <img src="logo_ska.png" alt="SKA Logo" class="h-12 object-contain">
      </div>
      <h2 class="text-lg font-bold text-slate-900 tracking-tight">SKA PPM Portal</h2>
      <p class="text-xs text-slate-500">RTS Link ICQC Bukit Chagar — Sila log masuk untuk meneruskan</p>
    </div>

    <!-- Mesej Ralat Login -->
    <div x-show="loginError" x-text="loginError" class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg font-medium"></div>

    <form @submit.prevent="loginUser" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Alamat E-mel</label>
        <input type="email" x-model="loginEmail" required placeholder="nama@skatech.com.my"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-indigo-600 focus:ring-0 outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kata Laluan</label>
        <input type="password" x-model="loginPassword" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-indigo-600 focus:ring-0 outline-none transition">
      </div>

      <button type="submit" :disabled="isLoggingIn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-semibold py-2.5 px-4 rounded-xl text-sm shadow-md transition flex justify-center items-center gap-2">
        <span x-show="isLoggingIn" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span x-text="isLoggingIn ? 'Sedang Log Masuk...' : 'Log Masuk'"></span>
      </button>
    </form>

    <p class="text-[11px] text-center text-slate-400 pt-2 border-t border-slate-100">
      SKA Technology Sdn. Bhd. &copy; 2026
    </p>
  </div>

</body>
</html>
